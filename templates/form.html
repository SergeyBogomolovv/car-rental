{% extends 'base.html' %}
{% block title %}
  {{ title }} — Ключ.на.старт
{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <!-- Карточка: https://getbootstrap.com/docs/5.0/components/card/#body -->
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h1 class="mb-4">{{ title }}</h1>
          <!-- Форма: https://getbootstrap.com/docs/5.0/forms/overview/#overview -->
          <form method="post">
            {% csrf_token %}
            {% include 'fields.html' %}
            <!-- Кнопки: https://getbootstrap.com/docs/5.0/components/buttons/ -->
            <div class="d-flex flex-wrap gap-2">
              <button class="btn btn-primary">{{ button_text }}</button>
              <a class="btn btn-outline-secondary" href="{% url 'requests' %}">К моим заявкам</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
