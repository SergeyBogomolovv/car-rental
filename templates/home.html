{% extends 'base.html' %}
{% load static %}
{% block content %}
  <!-- Сетка row/col и адаптивность: https://getbootstrap.com/docs/5.0/layout/grid/ -->
  <div class="row align-items-center g-3 mb-4">
    <div class="col-md-8">
      <h1 class="fw-bold">Ключ к вашим путешествиям</h1>
      <p class="text-secondary mb-0">Выберите автомобиль, оставьте заявку и отправляйтесь в путь.</p>
    </div>
    <div class="col-md-4 text-md-end">
      <a href="{% url 'request_create' %}" class="btn btn-primary">Оформить аренду</a>
    </div>
  </div>

  <!-- Слайдер с кнопками и индикаторами: https://getbootstrap.com/docs/5.0/components/carousel/#with-indicators -->
  <!-- Автосмена и interval: https://getbootstrap.com/docs/5.0/components/carousel/#options -->
  <div id="car-slider" class="carousel slide carousel-fade rounded-4 overflow-hidden mb-5" data-bs-ride="carousel" data-bs-interval="3000">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#car-slider" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Слайд 1"></button>
      <button type="button" data-bs-target="#car-slider" data-bs-slide-to="1" aria-label="Слайд 2"></button>
      <button type="button" data-bs-target="#car-slider" data-bs-slide-to="2" aria-label="Слайд 3"></button>
      <button type="button" data-bs-target="#car-slider" data-bs-slide-to="3" aria-label="Слайд 4"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="{% static 'img/slide1.jpg' %}" class="d-block w-100" alt="Автомобиль для вашего путешествия" />
      </div>
      <div class="carousel-item">
        <img src="{% static 'img/slide2.webp' %}" class="d-block w-100" alt="Новые маршруты на арендованном автомобиле" />
      </div>
      <div class="carousel-item">
        <img src="{% static 'img/slide3.jpg' %}" class="d-block w-100" alt="Свобода передвижения с Ключ.на.старт" />
      </div>
      <div class="carousel-item">
        <img src="{% static 'img/Toyota.webp' %}" class="d-block w-100" alt="Toyota Camry в нашем автопарке" />
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#car-slider" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Назад</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#car-slider" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Вперед</span>
    </button>
  </div>

  <h2 class="mb-4">Наши автомобили</h2>
  <div class="row g-4">
    {% for car in cars %}
      <div class="col-md-4">
        <!-- Карточка с изображением: https://getbootstrap.com/docs/5.0/components/card/#example -->
        <article class="card car-card h-100 border-0 shadow-sm">
          <img src="{% static car.image %}" class="card-img-top" alt="{{ car.name }}" loading="lazy" />
          <div class="card-body d-flex flex-column">
            <h3 class="h5">{{ car.name }}</h3>
            <p class="text-secondary">{{ car.description }}</p>
            <a href="{% url 'request_create' %}" class="btn btn-outline-primary mt-auto">Оформить заявку</a>
          </div>
        </article>
      </div>
    {% endfor %}
  </div>
{% endblock %}
